<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 96 96" width="96" height="96" role="img" aria-label="누디 사서 임시 프로필 이미지">
  <!--
    누디(바다달팽이/갯민숭달팽이) 사서 임시 프로필 이미지.
    실제 일러스트가 준비되기 전까지 쓰는 placeholder로,
    준비되면 이 파일과 librarians.js의 profileImage 경로를 교체하면 된다.
  -->
  <circle cx="48" cy="48" r="46" fill="#f7d6ea" />
  <circle cx="48" cy="48" r="46" fill="none" stroke="#d94f9a" stroke-width="2" stroke-dasharray="4 3" />
  <text x="48" y="58" font-size="42" text-anchor="middle" dominant-baseline="middle">🐌</text>
  <text x="48" y="88" font-size="10" text-anchor="middle" fill="#a03c78" font-family="sans-serif">임시 이미지</text>
</svg>
